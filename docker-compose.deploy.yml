services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tpdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: maimounakane/backend:latest          # ton image backend sur Docker Hub
    environment:
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/tpdb
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    image: maimounakane/frontend:latest        # ton image frontend sur Docker Hub
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: